<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0e27">
  <title>Page not found | Satwinder Singh</title>
  <style>
    :root { color-scheme: dark; font-family: "Plus Jakarta Sans", Inter, system-ui, sans-serif; background: #0a0e27; color: #f8fafc; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; background: radial-gradient(ellipse at 50% 35%, #151d3b 0, #0a0e27 65%); }
    main { width: min(100%, 40rem); text-align: center; }
    .code { color: #67e8f9; font-size: clamp(4rem, 18vw, 8rem); font-weight: 800; line-height: 1; }
    h1 { margin: 1rem 0; font-size: clamp(1.8rem, 6vw, 2.75rem); }
    p { color: #cbd5e1; line-height: 1.7; }
    a { display: inline-flex; margin-top: 1rem; padding: .9rem 1.3rem; border-radius: 999px; background: linear-gradient(120deg, #00d9ff, #8b5cf6); color: #071122; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>Page not found</h1>
    <p>The page you requested isn’t available. You can return to Satwinder Singh’s portfolio homepage.</p>
    <a href="/">Go to homepage</a>
  </main>
</body>
</html>
